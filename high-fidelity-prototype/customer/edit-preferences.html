<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Preferences - Glow Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="sticky-top">
            <div class="navbar">
                <a href="../index.html" class="navbar-brand mb-2">
                    <img src="../images/logo.png" alt="" class="img-fluid logo" style="width: 150px; height: 50px;">
                </a>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link under-scored">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="browse-services.html" class="nav-link under-scored">Browse Services</a>
                    </li>
                    <li class="nav-item">
                        <a href="my-appointments.html" class="nav-link under-scored">My Appointments</a>
                    </li>
                    <li class="nav-item">
                        <a href="profile.html" aria-current="page" class="nav-link fw-bold" style="border-bottom: 1px solid;">My Profile</a>
                    </li>
                    <li class="nav-item">
                        <a href="../index.html" class="nav-link fw-bold">Log out</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Edit Preferences header -->
        <section class="section ">
            <div class="container">
                <div class="edit-info-header">
                    <div class="edit-info-title">Edit Preferences</div>
                    <div class="edit-info-subtitle">Update your preferences below</div>
                </div>
            </div>
        </section>

        <!-- Edit Preferences Form -->
        <section class="section">
            <div class="container" style="max-width: 600px;">
                <div class="card profile-card">
                    <div class="profile-card-header">
                        <h2 class="profile-card-title">Edit Preferences</h2>
                    </div>
                    <div class="card-content">
                        <form id="editPreferencesForm">
                            <div class="form-group">
                                <label for="preferredServices">Preferred Service(s)</label>
                                <input type="text" id="preferredServices" placeholder="e.g., Haircuts, Nail Painting" required>
                            </div>
                            <div class="form-group">
                                <label for="preferredProviders">Preferred Provider(s)</label>
                                <input type="text" id="preferredProviders" placeholder="e.g., Brain Davis" required>
                            </div>
                            <div class="form-group">
                                <label for="preferredAppointments">Preferred Appointment Time(s)</label>
                                <input type="text" id="preferredAppointments" placeholder="e.g., Weekdays, 11 AM - 7 PM" required>
                            </div>
                            <div class="form-group">
                                <label for="communicationPreferences">Communication Preference(s)</label>
                                <input type="text" id="communicationPreferences" placeholder="e.g., Email & Text Reminders" required>
                            </div>
                            <button type="button" onclick="window.location.href='profile.html'" class="btn settings-btn settings-btn-sm">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p class="mb-0">© 2026 GlowUp. All rights reserved. Connecting customer with certified beauty professionals.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>

</html>
