<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - Glow Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="sticky-top">
            <div class="navbar">
                <a href="../index.html" class="navbar-brand mb-2">
                    <img src="../images/logo.png" alt="" class="img-fluid logo" style="width: 150px; height: 50px;">
                </a>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link under-scored">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="browse-services.html" class="nav-link under-scored">Browse Services & Providers</a>
                    </li>
                    <li class="nav-item">
                        <a href="my-appointments.html" aria-current="page" class="nav-link fw-bold"
                            style="border-bottom: 1px solid;">My Appointments</a>
                    </li>
                    <li class="nav-item">
                        <a href="profile.html" class="nav-link under-scored">My Profile</a>
                    </li>
                    <li class="nav-item">
                        <a href="../index.html" class="nav-link fw-bold">Log out</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Review Header -->
        <section class="section ">
            <div class="container">
                <div class="review-header">
                    <div class="review-title">Appointment Review</div>
                    <div class="review-subtitle">View and edit your review for this appointment</div>
                </div>
            </div>
        </section>

        <!-- Review Form -->
         <section class="section">
            <div class="container" style="max-width: 600px;">
                <div class="card profile-card">
                    <div class="profile-card-header">
                        <h2 class="profile-card-title">Your Review for Haircut with Brian Davis</h2>
                    </div>
                    <div class="card-content">
                        <form id="reviewForm">
                            <div class="form-group">
                                <label for="rating">Rating (1-5 stars)</label>
                                <input type="number" id="rating" min="1" max="5" placeholder="Enter your rating, e.g, 4.7" required>
                            </div>
                            <div class="form-group">
                                <label for="review">Your Review</label>
                                <textarea id="review" placeholder="Share your experience..." required></textarea>
                            </div>
                            <button type="button" onclick="updateReview()" class="btn settings-btn settings-btn-sm">Update Review</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

         <!-- Footer -->
         <footer>
            <p class="mb-0">© 2026 GlowUp. All rights reserved. Connecting customer with certified beauty professionals.</p>
        </footer>
    </div>

    <script>
        function updateReview() {
            alert("Your review has been updated successfully!");
            window.location.href = "my-appointments.html"; // Redirect to My Appointments page
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>

</html>
